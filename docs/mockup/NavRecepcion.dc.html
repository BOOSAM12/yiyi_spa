<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú de recepción</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Menú de recepción" style="width: 248px; box-sizing: border-box; min-height: 100%; height: 100%; padding: 20px 14px; background: #f7eff3; border-right: 1px solid #eedfe6; display: flex; flex-direction: column; gap: 4px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; color: #3a2a35">
<span style="font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #7a6672; padding: 4px 12px 6px">RECEPCIÓN</span>
<a href="Recepcion.dc.html" style="{{s.inicio}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio de recepción</a>
<a href="Agenda.dc.html" style="{{s.agenda}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Agenda</a>
<a href="Citas.dc.html" style="{{s.citas}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Citas y lista de espera</a>
<a href="POS.dc.html" style="{{s.pos}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>Punto de venta y caja</a>
<a href="Clientes.dc.html" style="{{s.clientes}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Clientes</a>
<div style="margin-top: auto; padding: 14px; border-radius: 14px; background: #ffffff; border: 1px solid #eedfe6; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #7a6672">PERMISOS DE ESTE ROL</span>
<span style="color: #7a6672">No ve finanzas, comisiones, reportes, inventario ni configuración. Tampoco el historial clínico.</span>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","agenda","citas","pos","clientes"],"default":"inicio"},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'inicio';
    const base = 'display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; ';
    const s = {};
    ['inicio', 'agenda', 'citas', 'pos', 'clientes'].forEach((k) => {
      s[k] = base + (k === active
        ? 'background: #ffffff; color: #a63d64; font-weight: 700; box-shadow: 0 1px 2px rgba(58,42,53,.06); border: 1px solid #f4c6d4;'
        : 'color: #3a2a35; font-weight: 500; border: 1px solid transparent;');
    });
    return { s };
  }
}
</script>
</body>
</html>
