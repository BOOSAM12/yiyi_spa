<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva cita</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<aside aria-label="Nueva cita" style="width: 440px; max-width: 100%; height: 100%; min-height: 100%; box-sizing: border-box; background: #ffffff; border-radius: 18px 0 0 18px; box-shadow: -12px 0 40px rgba(58,42,53,.12); display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; line-height: 21px; color: #3a2a35">
<div style="padding: 20px 24px; border-bottom: 1px solid #eedfe6; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column">
<span style="font-size: 20px; line-height: 28px; font-weight: 700">Nueva cita</span>
<span style="font-size: 13px; color: #7a6672">Solo verás horarios realmente disponibles</span>
</div>
<button aria-label="Cerrar" onClick="{{close}}" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #eedfe6; background: #ffffff; color: #7a6672; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; overflow: auto; flex: 1">
<label style="font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 6px">Cliente
<input value="Valentina Gómez · 310 456 7821" style="font: inherit; font-weight: 400; height: 40px; padding: 0 12px; border: 1px solid #dcc6d1; border-radius: 8px; background: #ffffff; color: #3a2a35">
<span style="font-weight: 500; color: #7a6672; display: flex; gap: 8px; align-items: center">Alérgica al acrilato · Prefiere a Laura <a href="Clientes.dc.html" style="margin-left: auto; color: #a63d64; text-decoration: none; font-weight: 600">+ Cliente nuevo</a></span>
</label>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Servicios (puedes elegir varios)</span>
<sc-for list="{{services}}" as="sv" hint-placeholder-count="5">
<button onClick="{{sv.toggle}}" style="{{sv.st}}">
<span style="display: flex; flex-direction: column; text-align: left"><span style="font-weight: 600">{{sv.label}}</span><span style="font-size: 12px; color: #7a6672">{{sv.meta}}</span></span>
<span style="margin-left: auto; font-weight: 700">{{sv.priceTxt}}</span>
</button>
</sc-for>
</div>
<label style="font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 6px">Profesional
<select style="font: inherit; font-weight: 400; height: 40px; padding: 0 10px; border: 1px solid #dcc6d1; border-radius: 8px; background: #ffffff; color: #3a2a35">
<option>Laura Torres · Manicurista</option>
<option>Cualquier profesional disponible (más horarios)</option>
<option>Daniela Ruiz · Pedicurista</option>
<option>Mariana López · Esteticista</option>
</select>
</label>
<div style="display: flex; gap: 12px">
<label style="flex: 1; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 6px">Fecha
<input type="date" value="2026-10-24" style="font: inherit; font-weight: 400; height: 40px; padding: 0 10px; border: 1px solid #dcc6d1; border-radius: 8px; background: #ffffff; color: #3a2a35">
</label>
<label style="flex: 1; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 6px">Origen
<select style="font: inherit; font-weight: 400; height: 40px; padding: 0 10px; border: 1px solid #dcc6d1; border-radius: 8px; background: #ffffff; color: #3a2a35">
<option>Teléfono</option><option>Presencial (walk-in)</option><option>WhatsApp</option><option>Online</option>
</select>
</label>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Horarios disponibles · sábado 24 oct</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{slots}}" as="sl" hint-placeholder-count="8">
<button onClick="{{sl.pick}}" style="{{sl.st}}">{{sl.t}}</button>
</sc-for>
</div>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; padding: 12px; border-radius: 12px; background: #efe9fb; color: #6b52a8">
<input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #6b52a8">
Cobrar depósito del 30% por Nequi o PSE para confirmar
</label>
<label style="font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 6px">Notas
<textarea rows="2" style="font: inherit; font-weight: 400; padding: 10px 12px; border: 1px solid #dcc6d1; border-radius: 8px; background: #ffffff; color: #3a2a35; resize: vertical">Quiere diseño francés en tono nude.</textarea>
</label>
<div style="padding: 14px 16px; border-radius: 14px; background: #fdf8fa; border: 1px solid #eedfe6; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between"><span style="color: #7a6672">Duración total</span><span style="font-weight: 600">{{durTxt}}</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: #7a6672">Incluye preparación entre servicios</span><span style="font-weight: 600">{{bufTxt}}</span></div>
<div style="display: flex; justify-content: space-between; font-size: 16px; margin-top: 4px"><span style="font-weight: 700">Total</span><span style="font-weight: 700">{{totalTxt}}</span></div>
</div>
</div>
<div style="padding: 16px 24px; border-top: 1px solid #eedfe6; display: flex; justify-content: flex-end; gap: 12px">
<button onClick="{{close}}" style="font: inherit; font-weight: 600; height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #eedfe6; background: #ffffff; color: #7a6672; cursor: pointer">Cancelar</button>
<button onClick="{{close}}" style="font: inherit; font-weight: 600; height: 44px; padding: 0 20px; border-radius: 12px; border: 1px solid transparent; background: #e8a5bb; color: #3a2a35; cursor: pointer">Agendar cita</button>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: { mani: true, pedi: true }, slot: '10:30' };
  }
  renderVals() {
    const fmt = (n) => '$ ' + n.toLocaleString('es-CO');
    const list = [
      { id: 'mani', label: 'Manicure semipermanente', dur: 45, buf: 10, price: 55000 },
      { id: 'pedi', label: 'Pedicure spa', dur: 60, buf: 10, price: 70000 },
      { id: 'retiro', label: 'Retiro de gel', dur: 15, buf: 0, price: 15000 },
      { id: 'diseno', label: 'Diseño de uñas (10 uñas)', dur: 20, buf: 0, price: 25000 },
      { id: 'masaje', label: 'Masaje relajante', dur: 60, buf: 15, price: 120000 }
    ];
    const sel = this.state.sel;
    let dur = 0, buf = 0, total = 0;
    const services = list.map((s) => {
      const on = !!sel[s.id];
      if (on) { dur += s.dur + s.buf; buf += s.buf; total += s.price; }
      return {
        label: s.label,
        meta: s.dur + ' min' + (s.buf ? ' + ' + s.buf + ' min de preparación' : ''),
        priceTxt: fmt(s.price),
        st: 'font: inherit; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; cursor: pointer; color: #3a2a35; ' + (on ? 'background: #fbe6ed; border: 1.5px solid #e8a5bb;' : 'background: #ffffff; border: 1px solid #eedfe6;'),
        toggle: () => this.setState({ sel: Object.assign({}, sel, { [s.id]: !on }) })
      };
    });
    const times = ['9:00', '9:30', '10:30', '11:00', '13:30', '14:00', '15:30', '16:00'];
    const slots = times.map((t) => ({
      t,
      st: 'font: inherit; font-weight: 600; height: 40px; border-radius: 10px; cursor: pointer; ' + (t === this.state.slot ? 'background: #6b52a8; color: #ffffff; border: 1px solid #6b52a8;' : 'background: #ffffff; color: #3a2a35; border: 1px solid #dcc6d1;'),
      pick: () => this.setState({ slot: t })
    }));
    const h = Math.floor(dur / 60), m = dur % 60;
    return {
      services, slots,
      durTxt: (h ? h + ' h ' : '') + (m ? m + ' min' : ''),
      bufTxt: buf + ' min',
      totalTxt: fmt(total),
      close: () => { if (this.props.onClose) this.props.onClose(); }
    };
  }
}
</script>
</body>
</html>
