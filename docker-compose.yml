# Development services only. Credentials are for local development.
name: yiyi

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: yiyi
      POSTGRES_PASSWORD: yiyi
      POSTGRES_DB: yiyi
    ports:
      - "127.0.0.1:${YIYI_PG_PORT:-5418}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yiyi -d yiyi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${YIYI_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${YIYI_MAIL_PORT:-1026}:1025"
      - "127.0.0.1:${YIYI_MAILPIT_UI_PORT:-8026}:8025"

volumes:
  pgdata:
